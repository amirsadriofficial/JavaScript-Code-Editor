# JS Code Editor — host nginx site config
#
# Domains (edit before install):
#   editor.example.com / www.editor.example.com
#
# Install (server admin):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/js-code-editor.conf
#   sudo ln -sf /etc/nginx/sites-available/js-code-editor.conf /etc/nginx/sites-enabled/js-code-editor.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL certificates are managed on the server (certbot), not by this repository.
# APP_PORT in deploy/.env must match the upstream port below (default 4020).

upstream js_code_editor {
    server 127.0.0.1:4020;
    keepalive 16;
}

# ── HTTP: ACME challenge + redirect to HTTPS ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name editor.example.com www.editor.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: editor ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name editor.example.com;

    # Replace paths after certbot issues the certificate for this domain.
    ssl_certificate     /etc/letsencrypt/live/editor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://js_code_editor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.editor.example.com;

    ssl_certificate     /etc/letsencrypt/live/editor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.example.com/privkey.pem;

    return 301 https://editor.example.com$request_uri;
}
