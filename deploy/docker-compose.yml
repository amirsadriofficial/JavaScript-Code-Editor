# JS Code Editor — production stack (self-contained)
#
# Usage (from this directory):
#   cp .env.example .env
#   docker compose --env-file .env up -d --build

name: js-code-editor

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: js-code-editor:latest
    container_name: js-code-editor-web
    restart: unless-stopped
    ports:
      # Loopback only — host nginx is the public entrypoint.
      - "127.0.0.1:${APP_PORT:-4020}:80"
    networks:
      - js-code-editor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  js-code-editor:
    name: js-code-editor
    driver: bridge
